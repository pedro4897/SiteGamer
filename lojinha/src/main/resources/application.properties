spring.application.name=lojinha
server.port=8081

# 1. Configuração da Ligação (DataSource)
spring.datasource.url=jdbc:sqlite:lojinha.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# 2. Configuração do Dialeto Obrigatório para Hibernate 7
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# 3. Configurações adicionais de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true