<main class="recovery-page">
	<section class="recovery-panel">
		<div class="recovery-heading">
			<span class="recovery-kicker">Recuperação de conta</span>
			<h1>Esqueceu sua senha?</h1>
			<p>Informe o email usado no cadastro para receber as instruções de criação de uma nova senha.</p>
		</div>

		<form [formGroup]="recuperacaoForm" (ngSubmit)="onSubmit()" novalidate>
			<div class="field-group">
				<label for="recovery-email">Email</label>
				<input
					id="recovery-email"
					type="email"
					formControlName="email"
					class="form-control"
					placeholder="voce@exemplo.com"
					autocomplete="email">
				<small class="field-error" *ngIf="recuperacaoForm.controls.email.touched && recuperacaoForm.controls.email.hasError('required')">Informe seu email.</small>
				<small class="field-error" *ngIf="recuperacaoForm.controls.email.touched && recuperacaoForm.controls.email.hasError('email')">Digite um email válido com @.</small>
			</div>

			<div class="recovery-success" role="status" aria-live="polite" *ngIf="enviado">
				<i class="bi bi-envelope-check" aria-hidden="true"></i>
				<span>Se houver uma conta associada a esse email, enviaremos as instruções para redefinir sua senha.</span>
			</div>

			<button class="recovery-submit" type="submit">
				<i class="bi bi-envelope-arrow-up" aria-hidden="true"></i>
				Enviar instruções
			</button>
		</form>

		<div class="recovery-footer">
			<a routerLink="/Login">
				<i class="bi bi-arrow-left" aria-hidden="true"></i>
				Voltar ao login
			</a>
		</div>
	</section>
</main>
