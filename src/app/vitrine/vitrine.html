<main class="container-fluid vitrine-page">
	<section class="showcase-banner" aria-label="Desconto em todos os jogos">
	<div id="demo" class="carousel slide" data-bs-ride="carousel">
		<div class="carousel-indicators">
    		<button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    		<button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    		<button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
			<button type="button" data-bs-target="#demo" data-bs-slide-to="3"></button>
  		</div>

 	 	<div class="carousel-inner">
    		<div class="carousel-item active">
      			<img src="Banner.jpg" alt="gta6">
    		</div>
    		<div class="carousel-item">
      			<img src="Banner2.jpg" alt="bombaPacth" >
    		</div>
    		<div class="carousel-item">
      			<img src="Banner3.jpg" alt="dragonBall">
    		</div>
			<div class="carousel-item">
      			<img src="Banner4.jpeg" alt="guitarHero">
    		</div>
		</div>
  
  		<button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    		<span class="carousel-control-prev-icon"></span>
  		</button>
  		<button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    		<span class="carousel-control-next-icon"></span>
  		</button>
	</div>
	</section>
	
	<div class="row g-4">
		<div class="col-12 col-sm-6 col-lg-4 col-xl-3" *ngFor="let obj of lista">
			<article class="game-card h-100">
				<div class="product-board">
					<span class="product-badge">50% OFF</span>
					<div class="game-cover-wrap">
						<img *ngIf="obj.imagem" [src]="obj.imagem" [alt]="'Capa de ' + obj.nome" class="game-cover">
					</div>
				</div>

				<div class="product-info">
					<span class="product-platform">PLAYSTATION 2</span>
					<h2>{{ obj.nome }}</h2>
					<p>{{ obj.descricao }}</p>
					<div class="price-line">
						<span class="old-price">R$ {{ obj.preco | number: '1.2-2' }}</span>
						<strong>R$ {{ obj.precoPromocional | number: '1.2-2' }}</strong>
					</div>
					<div class="product-actions">
						<a class="btn btn-info" [routerLink]="['/Detalhe', obj.id]">
							<i class="bi bi-controller" aria-hidden="true"></i>
							Detalhes
						</a>
						<button
							class="btn"
							[class.btn-success]="!estaNoCarrinho(obj.id)"
							[class.btn-outline-light]="estaNoCarrinho(obj.id)"
							[attr.aria-pressed]="estaNoCarrinho(obj.id)"
							[attr.aria-label]="estaNoCarrinho(obj.id) ? 'Remover ' + obj.nome + ' da cesta' : 'Adicionar ' + obj.nome + ' à cesta'"
							type="button"
							(click)="alternarNoCarrinho(obj)">
							<i [class]="estaNoCarrinho(obj.id) ? 'bi bi-check2' : 'bi bi-cart-plus'" aria-hidden="true"></i>
							{{ estaNoCarrinho(obj.id) ? 'No carrinho' : 'Comprar' }}
						</button>
					</div>
				</div>
			</article>
		</div>
	</div>
</main>
