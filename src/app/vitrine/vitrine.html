<main class="container-fluid vitrine-page">
	<section class="showcase-banner" aria-label="Desconto em todos os jogos">
		<iframe
			title="Desconto em todos os jogos"
			src="Background.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
			loading="eager"
			scrolling="no">
		</iframe>
	</section>
	<div class="row g-4">
		<div class="col-12 col-sm-6 col-lg-4 col-xl-3" *ngFor="let obj of lista">
			<article class="game-card h-100">
				<div class="product-board">
					<span class="product-badge">50% OFF</span>
					<div class="game-cover-wrap">
						<img *ngIf="obj.imagem" [src]="obj.imagem" [alt]="'Capa de ' + obj.nome" class="game-cover">
					</div>
				</div>

				<div class="product-info">
					<span class="product-platform">PLAYSTATION 2</span>
					<h2>{{ obj.nome }}</h2>
					<p>{{ obj.descricao }}</p>
					<div class="price-line">
						<span class="old-price">R$ {{ obj.preco | number: '1.2-2' }}</span>
						<strong>R$ {{ obj.precoPromocional | number: '1.2-2' }}</strong>
					</div>
					<div class="product-actions">
						<a class="btn btn-info" [routerLink]="['/Detalhe', obj.id]">
							<i class="bi bi-eye" aria-hidden="true"></i>
							Detalhes
						</a>
						<button class="btn btn-success" type="button">
							<i class="bi bi-cart-plus" aria-hidden="true"></i>
							Comprar
						</button>
					</div>
				</div>
			</article>
		</div>
	</div>
</main>
